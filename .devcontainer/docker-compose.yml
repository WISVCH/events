version: "3.8"

volumes:
  postgres-data:

services:
  app:
    container_name: javadev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: devcontainer

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:postgres

    depends_on:
      - postgres
      - mailcatcher

  postgres:
    image: docker.io/library/postgres:latest@sha256:fe9ef8058929c976110d4b75d9b939e61a590ba1e105e609e891c71bb39a8944
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: events
      POSTGRES_HOST_AUTH_METHOD: trust

  adminer:
    image: docker.io/library/adminer:latest@sha256:037125c2bc4836b4917d4fd08a16f817eac2848778c4e9aab87a8340aef08dfd
    restart: always
    depends_on: 
      - postgres
    ports:
      - "8082:8080"

  mailcatcher:
    image: docker.io/schickling/mailcatcher:latest@sha256:55ed289525a565f7587b138a423705267eb34eda1ec8d35acd6dc7966a933e84
    restart: on-failure
    network_mode: service:postgres

version: "3.8"

volumes:
  postgres-data:

services:
  app:
    container_name: javadev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: devcontainer

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:postgres

    depends_on:
      - postgres
      - mailcatcher

  postgres:
    image: docker.io/library/postgres:latest@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: events
      POSTGRES_HOST_AUTH_METHOD: trust

  adminer:
    image: docker.io/library/adminer:latest@sha256:cb8e97bff72b58e911743a0609075446bc0881fb7eca79137d8bc73736840a2b
    restart: always
    depends_on: 
      - postgres
    ports:
      - "8082:8080"

  mailcatcher:
    image: docker.io/schickling/mailcatcher:latest@sha256:55ed289525a565f7587b138a423705267eb34eda1ec8d35acd6dc7966a933e84
    restart: on-failure
    network_mode: service:postgres
